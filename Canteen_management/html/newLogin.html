<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
    <title>AdminLogin</title>
    <style>
        * {
            font-family: 'Bree serif';
        }

        .LoginForms {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .allBox {
            position: absolute;
            top: -100px;
            left: 36%;
            border: 1px solid rgb(204, 197, 197);
            border-radius: 6px;
            background-color: white;
            width: 26%;
            overflow: hidden;
            height: 323px;


            visibility: hidden;
        }

        .allBox h2 {
            text-align: left;
            margin: 16px 12px;
            letter-spacing: 0.03rem;
            word-spacing: 4px;
            font-size: 1.4rem;
        }

        #LoginForm {
            margin-left: 13px;
            padding: 1px;
        }

        label {
            font-size: 1.1rem;
        }

        #emailId #addEmail {
            text-align: left;

            border: 1px solid rgb(187, 181, 181);
            border-radius: 5px;
            padding: 5px 9px;
            background-color: #f2f2f2;
            margin: 10px 0px 15px 0px;
            width: 93%;
        }

        #password #addPass {
            text-align: left;

            border: 1px solid rgb(187, 181, 181);
            border-radius: 5px;
            padding: 5px 9px;
            background-color: #f2f2f2;
            margin: 10px 15px 15px 0px;
            width: 93%;
        }

        #password hr {
            margin: 0px;
        }

        #password {
            margin-top: 5px;
        }

        #Bottons {
            margin: 15px 30px 15px 0px;
            display: flex;
            float: right;


        }

        #CloseBtn {
            color: white;
            margin-right: 10px;
            border: none;
            background: grey;
            border-radius: 5px;
            padding: 4px 20px;
            font-size: 1.2rem;
            cursor: pointer;

        }

        #GoBtn {
            color: white;
            margin-left: 10px;
            border: none;
            background: blueviolet;
            border-radius: 5px;
            padding: 4px 20px;
            font-size: 1.2rem;
            cursor: pointer;

        }

        #CloseBtn:hover,
        #GoBtn:hover {
            transform: scale(1.05);
        }

        #CloseBtn:active,
        #GoBtn:active {
            transform: scale(0.9999);
        }

        ::placeholder {
            font-size: 0.9rem;
        }

        .open-popup {
            transition: scale(1.3);
            top: 10px;
            visibility: visible;
        }
    </style>
</head>

<body>
    <div class="LoginForms">

        <div id="allBox" class="allBox">
            <h2>Employee Login : </h2>
            <hr>
            <form action="" id="LoginForm">
                <div id="emailId">
                    <label for="">Email Id : </label><br>
                    <input type="email" name="" id="addEmail" placeholder="tiger@gmail.com">
                </div>
                <div id="password">
                    <label for="">Password : </label><br>
                    <input type="password" name="" id="addPass" placeholder="*****">
                </div>
                <hr>
                <div id="Bottons">
                    <button id="CloseBtn" onclick="closePopup()"> Close </button>
                    <button id="GoBtn">Go </button>
                </div>
            </form>
        </div>
        <button type="submit" onclick="openPopup()">Submit</button>
    </div>
    <script>
        let popup = document.getElementById("allBox");
        function openPopup() {
            popup.classList.add("open-popup");
        }

        function closePopup() {
            popup.classList.remove(open-popup);
        }
    </script>
</body>

</html>
