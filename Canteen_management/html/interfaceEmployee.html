<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0px;
            padding: 0px;
            overflow-x: hidden;
        }

        body {
            /* font-family: Verdana, Geneva, Tahoma, sans-serif; */
            font-family: "Bree serif", Verdana, Geneva, Tahoma, sans-serif;
        }

        #contents {
            margin: auto;
            width: 100%;
            border: 2px solid black;
        }

        #navbar {
            position: sticky;
            top: 0px;
            margin: auto;
            width: 100%;
            overflow: hidden;
            border: 3px solid rgb(120, 120, 236);
            background-color: rgb(225, 204, 240);
        }

        #nav {
            padding: 9px;
            /* border: 3px solid rgb(120, 120, 236);
            background-color: rgb(225, 204, 240); */
            height: 110px;
            margin: auto;
            width: 60%;
            display: flex;
            align-items: center;
            border-radius: 2px;
        }

        #header {
            margin-left: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #header #mainHead h1 {
            padding-top: 10px;
            margin-left: 25px;
            /* width: 300%; */
            font-weight: bold;
            font-size: 2.3rem;
            /* margin: 12px 0px 12px 14px; */
        }

        #header #logo img {
            height: 90px;
        }

        #searchBlock {
            margin: auto 7%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #searchBlock #searchLogo img {
            height: 15px;
        }

        #searchBlock input[type="text"] {
            font-size: 1.3rem;
            /* margin: 16px; */
            margin-top: 15px;
            text-align: left;
            margin-left: -4rem;
            border: 2px solid rebeccapurple;
            border-radius: 25px 0 0 25px;
            text-align: left;
            width: 515px;
            height: 50px;
            padding-left: 22px;

            /* font-family: Verdana, Geneva, Tahoma, sans-serif; */
            font-family: "Bree serif", Verdana, Geneva, Tahoma, sans-serif;
        }

        input[type="text"]::placeholder {
            font-size: 1.3rem;
            text-align: left;
        }

        #searchBlock #searchBtn {
            font-size: 1.2rem;
            /* padding: 13px 0px ; */
            height: 40px;
            border-radius: 0 25px 25px 0;
            font-family: "Bree serif", Verdana, Geneva, Tahoma, sans-serif;

            position: relative;
            border-radius: 0 25px 25px 0;
            width: 100px;
            height: 50px;
            cursor: pointer;
        }

        #searchBtn:hover {
            transform: scale(1.06);
        }

        #searchBtn:active {
            transform: scale(0.99999);
        }

        #cartImage img {
            cursor: pointer;
            height: 43px;
            position: absolute;
            right: 2.9rem;
            top: 2.7rem;
            padding: 6px 17px;
        }

        #cartImage #logo {
            transition: all 0.4s ease;
        }

        #cartImage #logo:hover {
            color: #1b1b1b;
            background-color: white;
            border-radius: 3px;
        }

        #cartImage #logo:active {
            background-color: rgb(233, 127, 127);
        }


        /* all menu btn properties is here */
        nav ul {
            display: flex;
            position: absolute;
            list-style: none;
            right: -100px;
        }

        nav ul li {
            margin: 0 11px;
            margin-top: -5px;
        }

        nav ul li a {
            font-size: 20px;
            font-weight: 500;
            /* color: #fff; */
            color: red;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 5px;
            padding: 8px 10px;
            transition: all 0.4s ease;
        }

        nav ul li a:hover {
            color: #1b1b1b;
            background-color: white;
        }

        nav ul li #active {
            color: #1b1b1b;
            background-color: white;
        }

        nav ul li #active:active,
        nav ul li a:active {
            background-color: rgb(233, 127, 127);
        }

        nav .menu-btn {
            color: #f2f2f2;
            font-size: 25px;
            cursor: pointer;
            display: none;
        }

        #click {
            display: none;
        }

        .menu-btn i {
            position: fixed;
            right: 2.5rem;
            top: 3.5rem;
            /*  right: 53rem;
            top: 12px;*/
            color: black;
        }

        @media (max-width: 1282px) {


            /* shifting header to left  */
            #header {
                margin-left: -61px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #header #mainHead h1 {
                padding-top: 10px;
                margin-left: 25px;
                /* width: 300%; */
                font-weight: bold;
                font-size: 2.3rem;
                /* margin: 12px 0px 12px 14px; */
            }


            nav .menu-btn {
                display: block;
            }

            #click:checked~.menu-btn i::before {
                content: "\f00d";
                font-size: 20px;
            }

            nav ul {
                position: fixed;
                top: 0px;
                left: 50%;
                right: 50%;

                transform: translate(-50%, -50%) scale(0.4);
                text-align: center;
                visibility: hidden;
                /* left: -100%; */

                background: #1b1b1b;
                margin: auto;
                height: 200px;
                /* margin : auto; */
                width: 100%;
                display: block;
                text-align: center;
                transition: all 0.4s ease;
            }

            #click:checked~ul {
                left: 0%;
                visibility: visible;
                height: 400px;
                top: 19.5rem;
                transform: translate(-0%, -50%) scale(1);
            }

            nav ul li {
                margin: 40px 0;
            }

            nav ul li a {
                /* border : 2px solid red;
              display : block; */
                font-size: 20px;
            }

            /* nav ul li a:hover,
            nav ul li #active{
                color : cyan;
                background: none;
            }
            */
        }

        #allBtn {
            margin: 0.5% auto;
            position: absolute;
            right: 6%;
        }

        #allBtn #buttons {
            margin-top: 4%;
            display: flex;
        }

        #allBtn #buttons #bar {
            display: flex;
        }

        #allBtn #buttons #bar #more {
            cursor: pointer;
            /* margin: 0px 10px 0px 10px; */
            /* background-color: rgb(220, 209, 209); */
            font-size: 1.4rem;
            font-weight: bold;
            /* padding: 5px 15px; */
            border: none;
            background: none;
            /* border: 2px solid red; */
            /* border-radius: 3px; */
        }

        #allBtn #buttons #bar #login {
            cursor: pointer;
            /* margin: 0px 10px 0px 20px; */
            /* background-color: rgb(220, 209, 209); */
            font-size: 1.4rem;
            font-weight: bold;
            /* padding: 2px 15px; */
            border: none;
            background: none;
            /* border: 2px solid red; */
            /* border-radius: 3px; */
        }

        .menuBtn a:hover {
            background-color: #f2f2f2;
        }

        .menuBtn a:active {
            transform: scale(0.999999);
        }

        #more a {
            padding: 5px 15px;
            text-decoration: none;
            color: black;
        }

        #login a {
            padding: 5px 10px;
            text-decoration: none;
            color: black;
        }

        .menuBtn {
            cursor: pointer;
            margin: auto;
        }

        #cart {
            margin: auto 20px;
            /* border : 2px solid black; */
            display: flex;
        }

        #cart #cartLogo img {
            height: 45px;
        }

        #cartLogo img:hover {
            transform: scale(1.06);
        }

        #cartLogo img:active {
            transform: scale(0.99999);
        }

        .profileContent h1 {
            text-align: center;
            margin-top: 60px;
        }

        /*   StockBottons  */
        .operations{
            margin : 1.2rem;
            display : flex;
            flex-direction :  column;
            justify-content: center;
            align-items: center;
        }
        .operations button{
            margin : 13px;
            padding : 3px 30px;
            border : none;
            background: #0982f3;
            border-radius : 5px;
        }
        .operations button a {
            font-family: 'Roboto Slab', 'Bree serif';
            text-decoration: none;
            font-weight: 500;
            color : white;
            font-size: 1.5rem;
            cursor : pointer;
        }
        .operations button:hover{
            background: blueviolet;
            transform: scale(1.02);
        }
    </style>
</head>

<body>
    <div id="navbar">
        <nav id="nav">
            <!-- heading -->
            <div id="header">
                <div id="logo" class="head">
                    <img src="/images/smartCanteenLogo.png" alt="😊">
                </div>
                <div id="mainHead" class="head">
                    <h1>Smart Canteen</h1>
                </div>
            </div>
            <!-- search box for user things -->
            <div id="searchBlock">
                <!-- <div id="search" class="searching">
                    <input type="text" name="search" id="searchTxt" placeholder="search your favorite dish">
                    <input id="searchBtn" type="submit" value="Search">
                </div> -->
                <!-- Bottuns for menu -->
                <div id="allBtn">
                    <div id="buttons">
                        <nav>
                            <input type="checkbox" name="" id="click">
                            <label for="click" class="menu-btn">
                                <i class="fa-sharp fa-solid fa-bars"></i>
                            </label>
                            <ul>
                                <li><a id="active" href="index.html">Home</a></li>
                                <li><a href="addFood.html">AddFood</a></li>
                                <li><a href="#">UpdateFood</a></li>
                                <li><a href="message.html">Message</a></li>
                                <li><a id="active" href="index.html">LogOut</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <div class="profileContent">
        <h1>My Another Contents</h1>
        <div class="operations">
            <div class="stockEntry">
                <button><a href="StockEntry.html">Stock-Entry</a></button>
            </div>
            <div class="stockIssue">
                <button><a href="StockIssue.html">Stock-Issue</a></button>
            </div>
        </div>
    </div>
</body>

</html>
